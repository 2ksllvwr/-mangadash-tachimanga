name: Compilar MangaDash legado
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/build-compat.yml
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: keiyoushi/extensions-source
          ref: d12e3b8a1eb5d7e5c7230f5b5b5854ba625a97dd
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '25'
      - name: Selecionar apenas MangaDash e manter API 1.4
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('settings.gradle.kts')
          s = p.read_text().replace('\nloadAllIndividualExtensions()\n', '\nloadIndividualExtension("pt", "mangadash")\n')
          p.write_text(s)
          p = Path('src/pt/mangadash/build.gradle.kts')
          s = p.read_text()
          assert 'libVersion = "1.4"' in s
          p.write_text(s.replace('versionCode = 1', 'versionCode = 2'))
          PY
      - name: Compilar e verificar lint
        run: bash ./gradlew :src:pt:mangadash:assembleRelease :src:pt:mangadash:lintRelease --no-daemon --console=plain
      - name: Preparar arquivos para assinatura local
        run: |
          mkdir -p output
          cp src/pt/mangadash/build/outputs/apk/release/*.apk output/
          cp src/pt/mangadash/build/intermediates/extension_jar/release/unsigned.jar output/unsigned.jar
          cp src/pt/mangadash/build/keiyoushi-source-info.json output/
          apksigner_path=$(find "$ANDROID_HOME/build-tools" -path '*/lib/apksigner.jar' | sort -V | tail -n 1)
          cp "$apksigner_path" output/apksigner.jar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mangadash-legacy-unsigned
          path: output/
          retention-days: 3

