name: Verificar MangaDash compatível

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'
  push:
    branches: [main]
    paths:
      - scripts/**
      - tests/**
      - repository.json
      - .github/workflows/update.yml

permissions:
  contents: write

concurrency:
  group: mangadash-update
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verificar Python
        run: python3 --version
      - name: Testar sincronizador
        run: python3 -m unittest discover -s tests -v
      - name: Verificar snapshot fixado e arquivos
        run: python3 scripts/sync.py
      - name: Conferir pacote publicado
        run: python3 -m unittest discover -s tests -v
      - name: Publicar alterações
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.json index.pb repo.json provenance.json SHA256SUMS jar apk
          git commit -m 'Atualiza extensão MangaDash verificada'
          git push
